tool: eslint-plugin-sonarjs
language: javascript
language_version: "22"
technique: "Code Quality Auditing"
classification: "Code Smell Detection"
target_files: [../../src/]
run:
  command: "npx eslint src/ --ext .js,.jsx"
expects:
  code_smell_scan_run: true
verified_in_session: true
verified_result: "loaded via plugin:sonarjs/recommended; 0 findings on the current src/ tree (widgets.js, App.jsx, main.jsx)"
