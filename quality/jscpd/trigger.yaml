tool: jscpd
language: javascript
language_version: "22"
technique: "Code Quality Auditing"
classification: "Code Duplication Detection"
target_files: [../../src/widgets.js, ../../src/App.jsx]
run:
  command: "npx jscpd --min-lines 3 --min-tokens 20 --reporters console src/"
expects:
  duplicate_clone_detected: false
verified_in_session: true
verified_result: "0 clones found across src/ (6 files, 327 lines, 2147 tokens) — no duplication, as intended for this minimal standalone repo"
